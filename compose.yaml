services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: bank_of_vivaldi
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bank_of_vivaldi"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql/data

  app:
    build:
      context: .
      target: dev
    working_dir: /app
    command: sh -c "go mod download && go run ./cmd/server"
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/bank_of_vivaldi?sslmode=disable
      HTTP_ADDR: :8080
      AUTO_MIGRATE: "true"
      GOFLAGS: -buildvcs=false
    ports:
      - "8080:8080"
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres-data:
