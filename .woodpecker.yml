steps:
  test:
    image: golang:1.24-bookworm
    commands:
      - go mod download
      - go test ./...

  build:
    image: golang:1.24-bookworm
    commands:
      - go mod download
      - go build ./cmd/...

  image:
    image: docker:27-cli
    commands:
      - docker build -t bank-of-vivaldi:ci .
    when:
      event:
        - push
