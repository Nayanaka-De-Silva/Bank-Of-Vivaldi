steps:
  - name: verify
    image: golang:1.24-bookworm
    environment:
      GOFLAGS: -buildvcs=false
    commands:
      - go mod download
      - go test ./...
      - go build ./cmd/...

  - name: build-image
    image: docker:27
    privileged: true
    depends_on:
      - verify
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    commands:
      - docker build --pull -t bank-of-vivaldi:latest .
    when:
      - event: push
        branch: master

  - name: deploy
    image: docker:27
    privileged: true
    depends_on:
      - build-image
    environment:
      # Production config lives in the 'prod_dotenv' Woodpecker repo secret
      # (repo settings -> Secrets), not a file on the runner host.
      PROD_DOTENV:
        from_secret: prod_dotenv
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    commands:
      - |-
        if [ -z "$${PROD_DOTENV}" ]; then
          echo "The 'prod_dotenv' secret is missing or empty. Add the production .env contents as a Woodpecker repo secret named prod_dotenv." >&2
          exit 1
        fi
      # Assemble a throwaway deploy dir in the CI workspace; it is discarded
      # when the pipeline ends. The stack's data lives in Docker named volumes
      # keyed by the -p project name, untouched by this.
      - mkdir -p deploy
      - cp docker-compose.prod.yml deploy/docker-compose.prod.yml
      - printf '%s\n' "$${PROD_DOTENV}" > deploy/.env
      - cd deploy
      - docker compose -p bank-of-vivaldi -f ./docker-compose.prod.yml config >/dev/null
      - APP_IMAGE=bank-of-vivaldi:latest docker compose -p bank-of-vivaldi -f ./docker-compose.prod.yml up --force-recreate -d --remove-orphans --wait --wait-timeout 120
      - docker image prune -f
    when:
      - event: push
        branch: master
